name: Keep Render Backend Awake

on:
  schedule:
    # Run every 10 minutes — Render free tier sleeps after 15 min of inactivity
    # Last updated: 2026-10-01 to re-activate after GitHub paused inactive workflow
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging backend health endpoint..."
          curl -f -sS --max-time 60 https://ai-interview-coach-zb5e.onrender.com/health && echo "Backend OK" || echo "Backend sleeping or down"
          echo "Pinging frontend proxy health endpoint..."
          curl -f -sS --max-time 30 https://ai-interview-coach-frontend-687t.onrender.com/api/py/health && echo "Frontend proxy OK" || echo "Frontend proxy sleeping or down"
