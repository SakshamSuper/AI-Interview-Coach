services:
  - type: web
    name: ai-interview-coach-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:///./data/interview_coach.db
      - key: FAISS_INDEX_DIR
        value: ./data/knowledge_base/faiss_index
      - key: MALLOC_TRIM_THRESHOLD_
        value: "65536"
      - key: WEB_CONCURRENCY
        value: "1"
